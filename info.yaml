# Tiny Tapeout project information
project:
  title: "5-Stage Pipelined MIPS-32 Processor"
  author: "harsha09x"
  discord: "" 
  description: "A classical 5-stage pipelined MIPS 32-bit CPU using a multiplexed bus interface"
  language: "Verilog"
  clock_hz: 10000000 
  tiles: "2x2"
  top_module: "tt_um_harsha09x_mips32"
  source_files:
    - "tt_um_harsha09x_mips32.v"
    - "mips32.v"

# Pinout mapping explicitly bound to the required array indices
pinout:
  # Inputs
  ui[0]: "data_in_bit0"
  ui[1]: "data_in_bit1"
  ui[2]: "data_in_bit2"
  ui[3]: "data_in_bit3"
  ui[4]: "data_in_bit4"
  ui[5]: "data_in_bit5"
  ui[6]: "bus_sel_bit0"
  ui[7]: "bus_sel_bit1"

  # Outputs
  uo[0]: "bus_out_bit0"
  uo[1]: "bus_out_bit1"
  uo[2]: "bus_out_bit2"
  uo[3]: "bus_out_bit3"
  uo[4]: "bus_out_bit4"
  uo[5]: "bus_out_bit5"
  uo[6]: "bus_out_bit6"
  uo[7]: "bus_out_bit7"

  # Bidirectional pins
  uio[0]: "bus_out_bit8"
  uio[1]: "bus_out_bit9"
  uio[2]: "bus_out_bit10"
  uio[3]: "bus_out_bit11"
  uio[4]: "bus_out_bit12"
  uio[5]: "bus_out_bit13"
  uio[6]: "bus_out_bit14"
  uio[7]: "bus_out_bit15"

# Documentation for the automatically generated datasheet
documentation:
  todo: "Verify multiplexer timing against memory block access cycles."
  inputs: "6-bit data slice input bus along with a 2-bit control signal (bus_sel) to assemble the internal 32-bit instruction."
  outputs: "Lower 8 bits of the multiplexed 16-bit processor output monitoring bus."
  bidirectional: "Upper 8 bits of the multiplexed 16-bit processor output monitoring bus configured as output space."

